 sb_upgrade_domain_buildings_decision_tooltip: "Opens the Supreme Builder hub. Pays gold at vanilla base adjusted by known construction-cost modifiers you have (Architect, lifestyle perks, and similar). Completes instantly — this is not a cancelable construction queue."
